<script>
var isInViewport = function (elem) {
    var bounding = elem.getBoundingClientRect();
    return (
        bounding.top >= 0 &&
        bounding.left >= 0 &&
        bounding.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
        bounding.right <= (window.innerWidth || document.documentElement.clientWidth)
    );
};
var banner = document.querySelector('.banner');
if (banner) {
	window.addEventListener('scroll', function (event) {
		if (isInViewport(banner)) {
			banner.classList.remove("not-in-view");
		} else {
			banner.classList.add("not-in-view");
		}
	}, false);
}
// codeblock copy
function codeblock_copy() {
    $("figure.highlight").hover(
        function() {
            var figure = $(this);
            $( this ).append($("<button class=\"btn codeblock-copy\"><i class=\"fas fa-clipboard\"></i></button>"));
        }, function() {
            $( this ).find("button").first().remove();
        }
    );
    $("figure.highlight").click(
        function() {
            var figure = $(this);
            navigator.clipboard.writeText(figure.find(".code").first()[0].innerText.trimEnd()).then(
                function() {
                    figure.find(".codeblock-copy").find("i").removeClass("fa-clipboard").addClass("fa-clipboard-check");
                }
            )
        }
    );
}
// apply codeblock copy
codeblock_copy()

// Netcup-style menu (Bootstrap collapse) — mobile overlay helpers
$(function () {
    var $menu = $('#navbarNav');
    var $toggler = $('#main-nav .navbar-toggler');
    if (!$menu.length || !$toggler.length) {
        return;
    }

    function setOpen(open) {
        $toggler.toggleClass('is-open', open);
        $toggler.attr('aria-expanded', open ? 'true' : 'false');
        $toggler.attr('aria-label', open ? 'Close menu' : 'Toggle navigation');
        document.body.classList.toggle('menu-open', open);
    }

    $menu.on('show.bs.collapse', function () {
        setOpen(true);
    });
    $menu.on('hide.bs.collapse', function () {
        setOpen(false);
    });

    $(document).on('keydown.siteMenu', function (event) {
        if (event.key === 'Escape' && $menu.hasClass('show')) {
            $menu.collapse('hide');
        }
    });

    $menu.on('click', '.nav-link', function () {
        if (window.matchMedia('(max-width: 991.98px)').matches) {
            $menu.collapse('hide');
        }
    });
});

// disabling form submissions if there are invalid fields
(function() {
    'use strict';
    window.addEventListener('load', function() {
      // Fetch all the forms we want to apply custom Bootstrap validation styles to
      var forms = document.getElementsByClassName('needs-validation');
      // Loop over them and prevent submission
      var validation = Array.prototype.filter.call(forms, function(form) {
        form.addEventListener('submit', function(event) {
          if (form.checkValidity() === false) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    }, false);
  })();

(function () {
    var btn = document.getElementById("theme-toggle");
    var logo = document.getElementById("navbar-logo");

    function currentTheme() {
        var t = document.documentElement.getAttribute("data-theme");
        return t === "light" ? "light" : "dark";
    }

    function syncLogo(theme) {
        if (!logo) return;
        var src = theme === "light"
            ? logo.getAttribute("data-logo-light")
            : logo.getAttribute("data-logo-dark");
        if (src && logo.getAttribute("src") !== src) {
            logo.setAttribute("src", src);
        }
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try {
            localStorage.setItem("tf-theme", theme);
        } catch (e) {}
        syncLogo(theme);
        if (!btn) return;
        var next = theme === "light" ? "dark" : "light";
        btn.setAttribute("aria-label", "Switch to " + next + " theme");
        btn.setAttribute("title", "Switch to " + next + " theme");
    }

    applyTheme(currentTheme());
    if (btn) {
        btn.addEventListener("click", function () {
            applyTheme(currentTheme() === "light" ? "dark" : "light");
        });
    }
})();
</script>
